---
layout: default
---
<main class="container">
    <article>
        <header class="container-header">
            {% if page.tags %}
            <ul class="post-tags">
                {% for tag in page.tags %}
                <li class="post-tag">{{tag}}</li>
                {% endfor %}
            </ul>
            {% endif %}
            <h1>{{page.title}}</h1>
        </header>
        <section>
            {{content}}
        </section>
        <footer class="container-footer">
            <p>Article written by me.</p>
            <time datetime="{{page.date}}">{{page.date | date: "%-d %B %Y"}}</time>
        </footer>
    </article>
</main>
