---
layout: default
---
<main>
    <article>
        <header class="post-header">
            {% if page.tags %}
            <ul class="discrete-list tags-list">
                {% for tag in page.tags %}
                <li>{{tag}}</li>
                {% endfor %}
            </ul>
            {% endif %}
            <h1>{{page.title}}</h1>
        </header>
        <section class="post-section">
            {{content}}
        </section>
        <footer class="post-footer">
            <p>Article written by {{site.author.fullname}}.</p>
            <time datetime="{{page.date}}">{{page.date | date: "%-d %B %Y"}}</time>
        </footer>
    </article>
</main>
